<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0">
<title>blog</title>
  <style>
    header{
    background-color: aliceblue;
color: aliceblue;
text-align: center;
max-width: 800px;
margin: 0 auto;
padding: 16px;
border: 5px solid purple;
}
    
main{
  background-color: blue;
  color: aliceblue;
  max-width: 800px;
margin: 0 auto;
padding: 16px;
}
    article{
  display: flex;
      flex-direction: column; 
      align-items: center;
      text-align: center;    
      gap: 16px;
    }
    .conteudo-post {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    img{
 width: 80px;
      height: 80px;
      object-fit: cover;
      flex-shrink: 0;
    }
   .artigo-autor {
      font-weight: bold;
    }
    button {
      cursor: pointer;
      padding: 6px 12px;
      margin-right: 8px;
    }
    </style>
</head>
    
<body>
  <header>
<h1>Meu blog sobre algumas curiosidades sobre fortnite</h1>
<p>Aqui vou compartilhar fatos e curiosidades sobre este jogo.</p>
  </header>
  <main>
    <article>
      <div class="conteudo-post">
       <img src="https://store.epicgames.com/news/find-it-in-fortnite?lang=pt-BR" 
    alt="imagem de Fortnite">
<div> 
    <h2>Meu primeiro blog</h2>
  <p class= "artigo-autor">Por: Luiz Otavio</p>
   <p>Boas-vindas ao meu primeiro blog! Aqui vou compartilhar sobre algumas curiosidades sobre fortnite. </p>
   <button class="btn-curtida">👍 <span>0</span></button> 
        <button class="btn-curtida">👎 <span>0</span></button>
</div>
      </div>
    </article>
  </main>
</body>
<script>
    const botoes = document.querySelectorAll('.btn-curtida');

    botoes.forEach(botao => {
      botao.addEventListener('click', () => {
        const contador = botao.querySelector('span');
        let valorAtual = parseInt(contador.textContent, 10);
        contador.textContent = valorAtual + 1;
      });
    });
  </script>
</html>
